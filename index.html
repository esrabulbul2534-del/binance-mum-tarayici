
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binance Futures 9 Mum Tarayıcı</title>
<style>
body{background:#10151d;color:#eee;font-family:Arial;padding:18px}
h2{color:#f0b90b}
button{background:#f0b90b;color:#111;border:0;padding:16px;border-radius:10px;font-weight:bold;font-size:16px}
.card{background:#1c2633;padding:14px;border-radius:14px;margin-top:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:12px 5px;border-bottom:1px solid #445;text-align:left}
.green{color:#20c77a;font-weight:bold}
#status{color:#f0b90b;margin-top:15px}
</style>
</head>
<body>

<h2>🟡 BINANCE FUTURES 9 YEŞİL MUM</h2>
<p>USDT sürekli vadeli işlemlerde 1 ve 4 saatlik grafiklerde son 9 kapanmış mumu yeşil olan coinler.</p>

<button onclick="scan()">TARAMAYI BAŞLAT</button>

<div id="status">Tarama başlatılmayı bekliyor.</div>

<div class="card">
<h3 id="count">Bulunan coin: 0</h3>
<table>
<thead>
<tr><th>COIN</th><th>1 SAAT</th><th>4 SAAT</th></tr>
</thead>
<tbody id="results">
<tr><td colspan="3">Henüz tarama yapılmadı.</td></tr>
</tbody>
</table>
</div>

<script>
const API="https://fapi.binance.com";

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function getJSON(url){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url);
      if(r.status===429){
        await sleep(2000*(i+1));
        continue;
      }
      if(!r.ok) throw new Error("API "+r.status);
      return await r.json();
    }catch(e){
      if(i===2) throw e;
      await sleep(1000);
    }
  }
  throw new Error("API bağlantı hatası");
}

async function green9(symbol,interval){
  const data=await getJSON(
    API+"/fapi/v1/klines?symbol="+symbol+
    "&interval="+interval+"&limit=10"
  );

  const now=Date.now();

  const closed=data.filter(k=>Number(k[6])<now).slice(-9);

  return closed.length===9 &&
    closed.every(k=>Number(k[4])>Number(k[1]));
}

async function scan(){
  const status=document.getElementById("status");
  const results=document.getElementById("results");
  const count=document.getElementById("count");

  results.innerHTML="";
  count.textContent="Bulunan coin: 0";
  status.textContent="Futures sözleşmeleri alınıyor...";

  try{
    const info=await getJSON(API+"/fapi/v1/exchangeInfo");

    const symbols=info.symbols.filter(s=>
      s.status==="TRADING" &&
      s.contractType==="PERPETUAL" &&
      s.quoteAsset==="USDT"
    );

    let checked=0;
    let found=0;
    let errors=0;
    let matches=[];

    status.textContent=symbols.length+
      " Futures sözleşmesi taranacak.";

    let index=0;

    async function worker(){
      while(index<symbols.length){
        const s=symbols[index++];
        try{
          const [h1,h4]=await Promise.all([
            green9(s.symbol,"1h"),
            green9(s.symbol,"4h")
          ]);

          if(h1&&h4){
            matches.push(s.symbol);
            found++;
          }
        }catch(e){
          errors++;
        }

        checked++;

        status.textContent=
          "Kontrol edilen: "+checked+"/"+symbols.length+
          " | Bulunan: "+found+
          " | Hata: "+errors;

        count.textContent="Bulunan coin: "+found;

        if(h1Placeholder()){}
        await sleep(350);
      }
    }

    function h1Placeholder(){return false;}

    await Promise.all(
      Array.from({length:4},()=>worker())
    );

    results.innerHTML="";

    matches.sort();

    for(const symbol of matches){
      const tr=document.createElement("tr");
      tr.innerHTML=
        "<td>"+symbol+"</td>"+
        '<td class="green">9/9 YEŞİL</td>'+
        '<td class="green">9/9 YEŞİL</td>';
      results.appendChild(tr);
    }

    if(found===0){
      results.innerHTML=
        '<tr><td colspan="3">Koşullara uyan coin bulunamadı.</td></tr>';
    }

    status.textContent=
      "Tarama tamamlandı. "+checked+
      " Futures sözleşmesi kontrol edildi. "+
      errors+" hata.";

  }catch(e){
    status.textContent="Bağlantı hatası: "+e.message;
  }
}
</script>
</body>
</html>
